[package]
name = "jwks"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
authors = ["Hung-Han Chen <chenhungh@gmail.com>"]
description = "A library for retrieving and parsing JSON Web Key Sets (JWKS)"
license-file = "LICENSE"
repository = "https://github.com/chenhunghan/jwks"
readme = "README.md"
keywords = ["jwt", "jsonwebtoken", "jwks"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
jsonwebtoken = "12"
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false, optional = true }
serde = { version = "1.0.195", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"

[features]
default = ["rust_crypto", "http"]
# Async fetching with reqwest (requires a tokio runtime).
http = ["dep:reqwest", "dep:serde"]
aws_lc_rs = ["jsonwebtoken/aws_lc_rs"]
rust_crypto = ["jsonwebtoken/rust_crypto"]

[dev-dependencies]
base64 = "0.23"
httpmock = "0.9"
rsa = "0.10"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35.1", features = ["full"] }

[[example]]
name = "basic_usage"
required-features = ["http"]

[[example]]
name = "jwt_validation"
required-features = ["http"]
